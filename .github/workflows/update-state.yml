name: Update State Gas Prices

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
      SHEET_ID: ${{ vars.SHEET_ID }}
      RUN_MODE: state

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth

      - name: Run state update
        run: python update_gas.py

      - name: Commit CSV changes
        run: |
          if [ -n "$(git status --porcelain -- data/state_war_start.csv)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/state_war_start.csv
            git commit -m "Update state war start CSV"
            git push
          else
            echo "No CSV changes to commit."
          fi
