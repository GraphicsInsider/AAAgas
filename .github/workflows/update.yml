name: Update Gas Prices

on:
  schedule:
    # Run at both 8:05 and 9:05 UTC, then gate to 4 AM and 5 AM America/New_York.
    # This keeps 4–5 AM local time consistent across DST changes.
    - cron: "5 8 * * *"
    - cron: "5 9 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
      BROWSERLESS_API_KEY: ${{ secrets.BROWSERLESS_API_KEY }}
      SHEET_ID: ${{ vars.SHEET_ID }}
      RUN_MODE: all

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth

      - name: Run only at 4–5 AM Eastern
        run: |
          hour="$(TZ=America/New_York date +%H)"
          if [ "$hour" != "04" ] && [ "$hour" != "05" ]; then
            echo "Skipping this UTC slot; NY hour is $hour."
            exit 0
          fi
          echo "Running scheduled update at 4–5 AM America/New_York."

      - name: Run script
        run: python update_gas.py
